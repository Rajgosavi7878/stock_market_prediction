<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center">Login</h2>

    <!-- Toast container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="toast align-items-center text-bg-{{ category }} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                  <div class="toast-body">{{ message }}</div>
                  <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>

    <!-- Login Form -->
    <form method="POST" action="/login" class="mt-4" id="loginForm">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control">
        </div>
        <button class="btn btn-primary w-100">Login</button>
    </form>

    <p class="mt-3 text-center">New user? <a href="/signup">Sign Up</a></p>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Toast + validation script -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Show any server-flashed toasts
        document.querySelectorAll('.toast').forEach(toastEl => {
            new bootstrap.Toast(toastEl, { delay: 2000 }).show();
        });

        // Client-side validation
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function (e) {
            const username = form.username.value.trim();
            const password = form.password.value.trim();
            clearClientToasts();

            if (!username || !password) {
                e.preventDefault(); // Prevent form from submitting
                showToast("Please enter both username and password.", "danger");
            }
        });

        // Function to create and show a new toast
        function showToast(message, category) {
            const container = document.getElementById('toastContainer');
            const toastEl = document.createElement('div');
            toastEl.className = `toast align-items-center text-bg-${category} border-0 mb-2`;
            toastEl.role = 'alert';
            toastEl.ariaLive = 'assertive';
            toastEl.ariaAtomic = 'true';
            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            `;
            container.appendChild(toastEl);
            new bootstrap.Toast(toastEl, { delay: 2500 }).show();
        }

        // Optional: Clear existing toasts
        function clearClientToasts() {
            const container = document.getElementById('toastContainer');
            container.querySelectorAll('.toast').forEach(t => t.remove());
        }
    });
</script>

</body>
</html>
