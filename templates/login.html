<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a0000);
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); /* Optional cool texture */
            font-family: 'Open Sans', sans-serif;
            color: #f1f1f1;
        }

        .login-card {
            background-color: #1a1a1a;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        .form-control {
            background-color: #2a2a2a;
            border: none;
            color: #fff;
        }

        .form-control:focus {
            border-color: #ff0033;
            box-shadow: 0 0 10px #ff0033;
        }

        .btn-red {
            background-color: #ff0033;
            border: none;
            color: white;
            transition: transform 0.2s ease-in-out;
        }

        .btn-red:hover {
            transform: scale(1.05);
            background-color: #e60029;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: #ff0033;
            margin-bottom: 1rem;
        }

#toastContainer {
        position: fixed !important;
        top: 1rem !important;
        right: 1rem !important;
        z-index: 9999 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-end !important;
    }

    .toast {
        background-color: #2a0000 !important;
        color: white !important;
        border: 1px solid #ff0033 !important;
        animation: fadeInRight 0.4s ease forwards !important;
        opacity: 1 !important;
        min-width: 250px;
        margin-bottom: 0.75rem;
    }

    @keyframes fadeInRight {
        from {
            opacity: 0;
            transform: translateX(20px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 login-card">
        <h2 class="text-center">Login</h2>

        <!-- Toast container -->
        <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="toast align-items-center border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">{{ message }}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}
        </div>

        <!-- Login Form -->
        <form method="POST" action="/login" id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control">
            </div>
            <button class="btn btn-red w-100">Login</button>
        </form>

        <p class="mt-3 text-center">New user? <a href="/signup" class="text-danger">Sign Up</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('.toast').forEach(toastEl => {
            new bootstrap.Toast(toastEl, { delay: 2000 }).show();
        });

        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function (e) {
            const username = form.username.value.trim();
            const password = form.password.value.trim();
            clearToasts();
            if (!username || !password) {
                e.preventDefault();
                showToast("Please enter both username and password.");
            }
        });

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toastEl = document.createElement('div');
            toastEl.className = `toast align-items-center border-0 mb-2`;
            toastEl.role = 'alert';
            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>`;
            container.appendChild(toastEl);
            new bootstrap.Toast(toastEl, { delay: 2500 }).show();
        }

        function clearToasts() {
            document.getElementById('toastContainer').innerHTML = '';
        }
    });
</script>
</body>
</html>
