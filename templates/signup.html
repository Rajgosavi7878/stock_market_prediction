<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Sign Up</h2>

    <!-- Flash messages as toasts -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="toast align-items-center text-bg-{{ 'danger' if category == 'danger' else category }} border-0"
                   role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                  <div class="toast-body">
                    {{ message }}
                  </div>
                  <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>

    <!-- Signup Form -->
    <form method="POST" action="/signup" class="shadow p-4 rounded bg-white" id="signupForm" novalidate>
        <div class="mb-3">
            <label class="form-label">Gmail</label>
            <input type="email" name="username" class="form-control" placeholder="Enter your Gmail">
        </div>
        <div class="mb-3">
            <label class="form-label">Password (min 6 characters)</label>
            <input type="password" name="password" class="form-control" placeholder="Create password">
        </div>
        <button class="btn btn-primary w-100">Sign Up</button>
    </form>

    <p class="mt-3 text-center">Already have an account? <a href="/login">Login</a></p>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS Toast & Validation -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Show server-side toasts
        document.querySelectorAll('.toast').forEach(toastEl => {
            new bootstrap.Toast(toastEl, { delay: 2000 }).show();
        });

        const form = document.getElementById('signupForm');
        form.addEventListener('submit', function (e) {
            const email = form.username.value.trim();
            const password = form.password.value.trim();
            const gmailRegex = /^[\w\.-]+@gmail\.com$/;

            let error = '';

            if (!email || !gmailRegex.test(email)) {
                error = "Please enter a valid Gmail address.";
            } else if (!password || password.length < 6) {
                error = "Password must be at least 6 characters.";
            }

            if (error) {
                e.preventDefault(); // ❌ stop form submission
                clearClientToasts(); // 🚫 clear old toasts
                showToast(error, 'danger'); // ✅ show new toast
            }
        });

        // Show a toast
        function showToast(message, category) {
            const toastContainer = document.getElementById('toastContainer');
            const toastEl = document.createElement('div');
            toastEl.className = `toast align-items-center text-bg-${category} border-0 mb-2`;
            toastEl.role = 'alert';
            toastEl.ariaLive = 'assertive';
            toastEl.ariaAtomic = 'true';
            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            `;
            toastContainer.appendChild(toastEl);
            new bootstrap.Toast(toastEl, { delay: 2000 }).show();
        }

        // Clear previously shown client-side toasts
        function clearClientToasts() {
            const container = document.getElementById('toastContainer');
            container.querySelectorAll('.toast').forEach(t => t.remove());
        }
    });
</script>


</body>
</html>
